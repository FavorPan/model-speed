<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Speed</title>
    <style>
        /* ---- Design tokens (one palette, one radius scale, locked) ---- */
        :root {
            /* surfaces - off-black, no pure #000 */
            --bg:            #0d0e12;
            --surface:       #16171d;
            --surface-2:     #1c1e26;
            --surface-3:     #23262f;
            --border:        #2a2d38;
            --border-soft:   #20222b;

            /* text - neutral zinc ramp */
            --text:          #e6e7eb;
            --text-2:        #a8abb5;
            --text-3:        #6b6e78;

            /* one accent - restrained cyan-blue, locked across the page */
            --accent:        #62a0ea;
            --accent-soft:   rgba(98, 160, 234, 0.14);
            --accent-line:   rgba(98, 160, 234, 0.40);

            /* semantic */
            --ok:            #57c785;
            --ok-soft:       rgba(87, 199, 133, 0.14);
            --warn:          #e5a234;
            --danger:        #e06c75;
            --danger-soft:   rgba(224, 108, 117, 0.12);

            /* radii - one scale */
            --r-card: 14px;
            --r-ctrl: 8px;
            --r-pill: 999px;

            /* motion */
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --dur: 180ms;

            font-feature-settings: "tnum" 1, "cv01" 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 22px 22px 28px;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* numbers stay aligned, never jitter */
        .num, .result-tokps, .history-tokps, .result-detail {
            font-variant-numeric: tabular-nums;
        }

        ::selection { background: var(--accent-soft); }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: var(--r-pill);
            border: 2px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover { background: #323642; }

        .container { max-width: 680px; margin: 0 auto; }

        /* ---- Header ---- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-mark {
            width: 30px; height: 30px;
            display: grid; place-items: center;
            border-radius: var(--r-ctrl);
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 15px;
            line-height: 1;
            border: 1px solid var(--accent-line);
        }
        .brand-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-3);
            margin-top: 1px;
        }

        /* ---- Status pill ---- */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 11px;
            border-radius: var(--r-pill);
            font-size: 0.76rem;
            font-weight: 500;
            background: var(--surface-2);
            color: var(--text-2);
            border: 1px solid var(--border);
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
        }
        .status .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-3);
            flex: none;
        }
        .status-idle .dot { background: var(--text-3); }
        .status-running {
            background: var(--ok-soft);
            color: var(--ok);
            border-color: rgba(87, 199, 133, 0.30);
        }
        .status-running .dot {
            background: var(--ok);
            animation: pulse 1.4s var(--ease) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        .next-test {
            font-size: 0.76rem;
            color: var(--text-3);
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        /* ---- Buttons ---- */
        .btn {
            padding: 9px 16px;
            border: 1px solid transparent;
            border-radius: var(--r-ctrl);
            cursor: pointer;
            font-size: 0.86rem;
            font-weight: 500;
            font-family: inherit;
            color: var(--text);
            background: var(--surface-2);
            border-color: var(--border);
            transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
        }
        .btn:hover { background: var(--surface-3); }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-soft);
            border-color: var(--accent-line);
        }

        .btn-primary {
            background: var(--accent);
            color: #0a1622;
            border-color: transparent;
            font-weight: 600;
        }
        .btn-primary:hover { background: #79b2ee; }
        .btn-primary:disabled {
            background: var(--surface-3);
            color: var(--text-3);
            cursor: not-allowed;
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(224, 108, 117, 0.35);
        }
        .btn-danger:hover {
            background: var(--danger-soft);
            border-color: var(--danger);
        }

        .btn-block { width: 100%; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-group .btn { flex: 1; }

        /* ---- Cards / sections ---- */
        .section {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-card);
            padding: 16px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 0.7rem;
            color: var(--text-3);
            margin-bottom: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        /* ---- Form controls ---- */
        label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-ctrl);
            color: var(--text);
            font-size: 0.88rem;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        input::placeholder, textarea::placeholder { color: var(--text-3); }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        textarea { resize: vertical; min-height: 64px; }

        /* ---- Custom select ---- */
        .select-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .select-wrap select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            margin-bottom: 0;
            padding-right: 34px;
            cursor: pointer;
        }
        .select-wrap select:hover { border-color: var(--border); background: var(--surface-2); }
        .select-caret {
            position: absolute;
            right: 13px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 1.5px solid var(--text-2);
            border-bottom: 1.5px solid var(--text-2);
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
            transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
        }
        .select-wrap select:focus + .select-caret,
        .select-wrap:hover .select-caret {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }
        .row > div { flex: 1; }

        /* ---- Checkbox ---- */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            font-size: 0.86rem;
            color: var(--text);
            margin: 4px 0 0;
        }
        .checkbox-label input {
            width: 16px; height: 16px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* ---- Tabs ---- */
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 14px;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-card);
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            border-radius: var(--r-ctrl);
            font-size: 0.86rem;
            font-weight: 500;
            font-family: inherit;
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            background: var(--surface-3);
            color: var(--text);
        }
        .tab:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: fade-in 220ms var(--ease);
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- Model list ---- */
        .model-item {
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-ctrl);
            padding: 12px;
            margin-bottom: 8px;
            transition: border-color var(--dur) var(--ease);
        }
        .model-item:hover { border-color: var(--border); }
        .model-item:last-child { margin-bottom: 0; }
        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .model-name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.92rem;
        }
        .model-type {
            font-size: 0.68rem;
            color: var(--text-2);
            background: var(--surface-3);
            padding: 2px 8px;
            border-radius: var(--r-pill);
            font-weight: 500;
            flex: none;
        }
        .model-url {
            font-size: 0.78rem;
            color: var(--text-3);
            word-break: break-all;
            line-height: 1.4;
        }
        .model-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .model-actions .btn {
            padding: 5px 11px;
            font-size: 0.78rem;
            flex: 0;
        }

        /* ---- Results ---- */
        .results { margin-top: 4px; }
        .result-item {
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-ctrl);
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            animation: fade-in 220ms var(--ease);
        }
        .result-item:last-child { margin-bottom: 0; }
        .result-model {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .result-stats { text-align: right; flex: none; }
        .result-tokps {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .result-tokps .unit,
        .history-tokps .unit {
            font-size: 0.6em;
            font-weight: 600;
            color: var(--text-3);
            margin-left: 2px;
            letter-spacing: 0;
        }
        .result-detail {
            font-size: 0.72rem;
            color: var(--text-3);
            margin-top: 2px;
        }
        .result-error {
            color: var(--danger);
            font-size: 0.76rem;
            margin-top: 3px;
        }
        .result-item.is-error .result-tokps { color: var(--danger); }

        /* ---- History ---- */
        .history-item {
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: var(--r-ctrl);
            padding: 12px;
            margin-bottom: 8px;
        }
        .history-item:last-child { margin-bottom: 0; }
        .history-time {
            font-size: 0.76rem;
            color: var(--text-3);
            margin-bottom: 9px;
            font-variant-numeric: tabular-nums;
        }
        .history-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .history-result {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            padding: 9px 10px;
            border-radius: var(--r-ctrl);
            text-align: center;
        }
        .history-model {
            font-size: 0.74rem;
            color: var(--text-2);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-tokps {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.01em;
        }
        .history-result .result-detail { margin-top: 3px; }

        /* ---- Empty state ---- */
        .empty {
            text-align: center;
            color: var(--text-3);
            padding: 22px 12px;
            font-size: 0.84rem;
        }

        /* ---- Toast ---- */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: var(--r-pill);
            font-size: 0.84rem;
            font-weight: 500;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
            z-index: 100;
            max-width: 90vw;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.is-error { border-color: rgba(224, 108, 117, 0.45); color: var(--danger); }
        #toast.is-ok { border-color: rgba(87, 199, 133, 0.40); color: var(--ok); }

        /* ---- Reduced motion ---- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">⚡</div>
                <div>
                    <div class="brand-name">Model Speed</div>
                    <div class="brand-sub">Token throughput benchmark</div>
                </div>
            </div>
            <div id="status" class="status status-idle"><span class="dot"></span><span id="statusText">Ready</span></div>
        </header>

        <div id="nextTest" class="next-test"></div>

        <div class="btn-group" style="margin-top: 0; margin-bottom: 14px;">
            <button id="runTestBtn" class="btn btn-primary" onclick="runTest()">▶ Run Test</button>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" role="tab" onclick="switchTab('models', this)">Models</button>
            <button class="tab" role="tab" onclick="switchTab('settings', this)">Settings</button>
            <button class="tab" role="tab" onclick="switchTab('history', this)">History</button>
        </div>

        <div id="tab-models" class="tab-content active">
            <div class="section">
                <div class="section-title">Configured Models</div>
                <div id="modelsList"></div>
            </div>

            <div class="section">
                <div class="section-title">Current Results</div>
                <div id="results" class="results"></div>
            </div>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="section">
                <div class="section-title">Add Model</div>
                <div class="row">
                    <div>
                        <label for="modelName">Name</label>
                        <input type="text" id="modelName" placeholder="My Model">
                    </div>
                    <div>
                        <label for="modelType">Type</label>
                        <div class="select-wrap">
                            <select id="modelType">
                                <option value="openai">OpenAI Compatible</option>
                                <option value="anthropic">Anthropic</option>
                            </select>
                            <span class="select-caret" aria-hidden="true"></span>
                        </div>
                    </div>
                </div>
                <label for="modelId">Model ID</label>
                <input type="text" id="modelId" placeholder="gpt-4o">
                <label for="modelUrl">Base URL</label>
                <input type="text" id="modelUrl" placeholder="https://api.openai.com/v1">
                <label for="modelKey">API Key</label>
                <input type="password" id="modelKey" placeholder="sk-...">
                <button class="btn btn-primary btn-block" onclick="addModel()">Add Model</button>
            </div>

            <div class="section">
                <div class="section-title">Test Settings</div>
                <div class="row">
                    <div>
                        <label for="testInterval">Test Interval (minutes)</label>
                        <input type="number" id="testInterval" value="30" min="1" max="1440">
                    </div>
                    <div>
                        <label for="testDuration">Test Duration (seconds)</label>
                        <input type="number" id="testDuration" value="60" min="10" max="600">
                    </div>
                </div>
                <label for="testPrompt">Fixed Test Prompt</label>
                <textarea id="testPrompt" rows="3" placeholder="Enter test prompt...">Say 'Token speed test successful' and count from 1 to 100.</textarea>
                <label class="checkbox-label">
                    <input type="checkbox" id="notifyOnComplete">
                    Notify on test complete
                </label>
                <button class="btn btn-primary btn-block" style="margin-top: 14px;" onclick="saveSettings()">Save Settings</button>
            </div>

            <div class="section">
                <div class="section-title">Timer Control</div>
                <div class="btn-group">
                    <button class="btn" onclick="startTimer()">Start Auto-Test</button>
                    <button class="btn btn-danger" onclick="stopTimer()">Stop Auto-Test</button>
                </div>
            </div>
        </div>

        <div id="tab-history" class="tab-content">
            <div class="section">
                <div class="btn-group" style="margin-top: 0;">
                    <button class="btn" onclick="exportHistory()">Export JSON</button>
                    <button class="btn btn-danger" onclick="clearHistory()">Clear History</button>
                </div>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        let invoke, listen;
        let testInterval = null;
        let timerInterval = null;
        let nextTestTime = null;
        let toastTimer = null;

        /* ---- Toast (replaces alert) ---- */
        function toast(msg, kind) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show' + (kind ? ' is-' + kind : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.className = 'toast' + (kind ? ' is-' + kind : ''); }, 2600);
        }

        async function loadModels() {
            try {
                const models = await invoke('get_models');
                renderModels(models);
            } catch (e) {
                console.error('Failed to load models:', e);
            }
        }

        function renderModels(models) {
            const container = document.getElementById('modelsList');
            if (models.length === 0) {
                container.innerHTML = '<div class="empty">No models configured. Add one above to get started.</div>';
                return;
            }
            container.innerHTML = models.map(m => `
                <div class="model-item">
                    <div class="model-header">
                        <span class="model-name">${escapeHtml(m.name)}</span>
                        <span class="model-type">${m.api_type}</span>
                    </div>
                    <div class="model-url">${escapeHtml(m.base_url)} / ${escapeHtml(m.id)}</div>
                    <div class="model-actions">
                        <button class="btn btn-danger" onclick="deleteModel('${m.name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function addModel() {
            const name = document.getElementById('modelName').value.trim();
            const api_type = document.getElementById('modelType').value;
            const id = document.getElementById('modelId').value.trim();
            const base_url = document.getElementById('modelUrl').value.trim();
            const api_key = document.getElementById('modelKey').value.trim();

            if (!name || !id || !base_url || !api_key) {
                toast('Please fill all fields', 'error');
                return;
            }

            try {
                const models = await invoke('get_models');
                models.push({ id, name, api_type, base_url, api_key });
                await invoke('save_models_cmd', { models });

                document.getElementById('modelName').value = '';
                document.getElementById('modelId').value = '';
                document.getElementById('modelUrl').value = '';
                document.getElementById('modelKey').value = '';
                loadModels();
                toast('Model added', 'ok');
            } catch (e) {
                toast('Failed to add model: ' + e, 'error');
            }
        }

        async function deleteModel(name) {
            if (!confirm(`Delete model "${name}"?`)) return;
            try {
                const models = await invoke('get_models');
                const filtered = models.filter(m => m.name !== name);
                await invoke('save_models_cmd', { models: filtered });
                loadModels();
                toast('Model deleted', 'ok');
            } catch (e) {
                toast('Failed to delete model: ' + e, 'error');
            }
        }

        async function loadSettings() {
            try {
                const settings = await invoke('get_settings');
                document.getElementById('testInterval').value = settings.test_interval_minutes;
                document.getElementById('testDuration').value = settings.test_duration_seconds;
                document.getElementById('testPrompt').value = settings.fixed_prompt;
                document.getElementById('notifyOnComplete').checked = settings.notify_on_complete;
            } catch (e) {
                console.error('Failed to load settings:', e);
            }
        }

        async function saveSettings() {
            const settings = {
                test_interval_minutes: parseInt(document.getElementById('testInterval').value),
                test_duration_seconds: parseInt(document.getElementById('testDuration').value),
                fixed_prompt: document.getElementById('testPrompt').value,
                notify_on_complete: document.getElementById('notifyOnComplete').checked
            };
            try {
                await invoke('save_settings_cmd', { settings });
                toast('Settings saved', 'ok');
            } catch (e) {
                toast('Failed to save settings: ' + e, 'error');
            }
        }

        async function runTest() {
            try {
                const running = await invoke('is_test_running');
                if (running) {
                    toast('Test already running', 'error');
                    return;
                }
                setStatus('running', 'Testing...');
                document.getElementById('results').innerHTML = '';
                await invoke('run_test');
            } catch (e) {
                toast('Failed to start test: ' + e, 'error');
                resetStatus();
            }
        }

        function setStatus(kind, text) {
            const el = document.getElementById('status');
            el.className = 'status status-' + kind;
            document.getElementById('statusText').textContent = text;
        }

        function resetStatus() {
            setStatus('idle', 'Ready');
        }

        async function loadHistory() {
            try {
                const history = await invoke('get_history');
                renderHistory(history);
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function renderHistory(history) {
            const container = document.getElementById('historyList');
            if (history.length === 0) {
                container.innerHTML = '<div class="empty">No history yet. Run a test to see results here.</div>';
                return;
            }
            container.innerHTML = history.slice().reverse().slice(0, 20).map(record => `
                <div class="history-item">
                    <div class="history-time">${new Date(record.tested_at).toLocaleString()}</div>
                    <div class="history-results">
                        ${record.results.map(r => `
                            <div class="history-result">
                                <div class="history-model" title="${escapeHtml(r.model_name)}">${escapeHtml(r.model_name)}</div>
                                <div class="history-tokps">${r.tok_per_sec.toFixed(1)} <span class="unit">tok/s</span></div>
                                <div class="result-detail">${r.total_time_ms}ms · ttft ${r.ttft_ms}ms</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function exportHistory() {
            try {
                const json = await invoke('export_history');
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `model-speed-history-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast('History exported', 'ok');
            } catch (e) {
                toast('Failed to export: ' + e, 'error');
            }
        }

        async function clearHistory() {
            if (!confirm('Clear all history?')) return;
            try {
                await invoke('clear_history');
                loadHistory();
                toast('History cleared', 'ok');
            } catch (e) {
                toast('Failed to clear history: ' + e, 'error');
            }
        }

        function startTimer() {
            const interval = parseInt(document.getElementById('testInterval').value) * 60 * 1000;
            nextTestTime = Date.now() + interval;
            updateNextTestDisplay();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (Date.now() >= nextTestTime) {
                    runTest();
                    nextTestTime = Date.now() + interval;
                }
                updateNextTestDisplay();
            }, 1000);
            toast('Auto-test started', 'ok');
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            nextTestTime = null;
            document.getElementById('nextTest').textContent = '';
            toast('Auto-test stopped');
        }

        function updateNextTestDisplay() {
            if (!nextTestTime) return;
            const remaining = Math.max(0, Math.ceil((nextTestTime - Date.now()) / 1000));
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            document.getElementById('nextTest').textContent = `Next test in ${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'history') loadHistory();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Listen for events from Rust
        function setupListeners() {
            console.log('[setupListeners] registering...');
            // 测试开始：清空 Current Results，避免与上一次结果叠加
            // （托盘菜单 "Run Test Now" 直接调用 run_test，绕过前端的 runTest()，所以清空逻辑放在这里）
            listen('test-started', () => {
                document.getElementById('results').innerHTML = '';
            });

            listen('test-progress', (event) => {
            console.log('[progress]', event.payload);
            const result = event.payload;
            const container = document.getElementById('results');
            const html = `
                <div class="result-item${result.error ? ' is-error' : ''}">
                    <div>
                        <div class="result-model">${escapeHtml(result.model_name)}</div>
                        ${result.error ? `<div class="result-error">${escapeHtml(result.error)}</div>` : ''}
                    </div>
                    <div class="result-stats">
                        <div class="result-tokps">${result.error ? 'ERR' : `${result.tok_per_sec.toFixed(1)} <span class="unit">tok/s</span>`}</div>
                        <div class="result-detail">${result.total_time_ms}ms · ttft ${result.ttft_ms}ms</div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });

        listen('test-finished', () => {
            console.log('[finished] event received');
            resetStatus();
        });
        }

        // Initialize - wait for Tauri global to be ready
        function init() {
            try {
                invoke = window.__TAURI__.core.invoke;
                listen = window.__TAURI__.event.listen;
            } catch (e) {
                document.body.innerHTML = '<div style="padding:40px;color:var(--danger);font-family:sans-serif">Failed to load Tauri API: ' + e + '</div>';
                return;
            }
            setupListeners();
            loadModels();
            loadSettings();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
